[package]
name = "shadow-design"
version = "0.1.0"
edition = "2021"
authors = ["ShadowfenixRaD", "Christian Torbidone <killerbossoriginal@gmail.com>"]
description = "UI component library for Dioxus web applications"

[dependencies]
dioxus = { workspace = true }

[features]
default = ["all"]
all = [
    "button",
    "card",
    "input",
    "checkbox",
    "badge",
    "navbar",
    "modal",
    "alert",
    "theme",
    "icon",
    "typography",
    "notification",
    "tabs",
    "switch",
    "tooltip",
    "drawer",
    "dropdown",
    "animation",
]
button = []
card = []
input = []
checkbox = []
badge = []
navbar = []
modal = []
alert = []
theme = []
icon = []
typography = []
notification = []
tabs = []
switch = []
tooltip = []
drawer = []
dropdown = []
animation = []
