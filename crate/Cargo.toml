[package]
name = "shadow-design"
version = "0.4.0"
edition = "2021"
authors = ["ShadowfenixRaD", "Christian Torbidone <killerbossoriginal@gmail.com>"]
description = "Modular, high-performance UI component library for Dioxus 0.7 applications"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://source.shadowfenix.net/development/shadow-design"
keywords = ["dioxus", "ui", "components", "wasm", "web"]
categories = ["gui", "wasm", "web-programming"]
include = [
    "src/**/*",
    "scss/**/*",
    "tests/**/*",
    "build.rs",
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dioxus = { workspace = true, features = ["lib"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["all"]
all = [
    "button",
    "card",
    "input",
    "select",
    "textarea",
    "checkbox",
    "badge",
    "navbar",
    "modal",
    "alert",
    "theme",
    "icon",
    "typography",
    "notification",
    "tabs",
