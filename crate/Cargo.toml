[package]
name = "shadow-design"
version = "0.3.0"
edition = "2021"
authors = ["ShadowfenixRaD", "Christian Torbidone <killerbossoriginal@gmail.com>"]
description = "Modular, high-performance UI component library for Dioxus 0.7 applications"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://source.shadowfenix.net/development/shadow-design"
keywords = ["dioxus", "ui", "components", "wasm", "web"]
categories = ["gui", "wasm", "web-programming"]
include = [
    "src/**/*",
    "scss/**/*",
    "tests/**/*",
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dioxus = { workspace = true, features = ["lib"] }
serde = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["all"]
all = [
    "button",
    "card",
    "input",
    "select",
    "textarea",
    "checkbox",
    "badge",
    "navbar",
    "modal",
    "alert",
    "theme",
    "icon",
    "typography",
    "notification",
    "tabs",
    "switch",
    "tooltip",
    "drawer",
    "dropdown",
    "animation",
    "avatar",
    "chat",
    "progress",
    "attachment_card",
    "contact_card",
    "segmented_control",
    "divider",
    "tree",
    "skeleton",
]
serde = ["dep:serde"]
button = []
card = []
input = ["icon"]
select = ["icon"]
textarea = ["icon"]
checkbox = ["icon"]
badge = []
navbar = ["icon"]
modal = ["icon"]
alert = ["icon"]
theme = []
icon = []
typography = []
notification = ["icon"]
tabs = ["icon"]
switch = []
tooltip = []
drawer = ["icon"]
dropdown = ["icon"]
animation = []
avatar = ["icon"]
chat = ["icon"]
progress = []
attachment_card = ["card", "icon", "progress", "button"]
attachment-card = ["attachment_card"]
contact_card = ["card", "avatar"]
contact-card = ["contact_card"]
segmented_control = ["icon"]
segmented-control = ["segmented_control"]
divider = []
tree = ["icon"]
skeleton = []

[lints.clippy]
must_use_candidate = "warn"
return_self_not_must_use = "warn"

