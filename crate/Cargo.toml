[package]
name = "shadow-design"
version = "0.1.0"
edition = "2021"
authors = ["ShadowfenixRaD", "Christian Torbidone <killerbossoriginal@gmail.com>"]
description = "Modular, high-performance UI component library for Dioxus 0.7 applications"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://source.shadowfenix.net/development/shadow-design"
keywords = ["dioxus", "ui", "components", "wasm", "web"]
categories = ["gui", "wasm", "web-programming"]
include = [
    "src/**/*",
    "scss/**/*",
    "README.md",
    "Cargo.toml",
    "LICENSE*",
]

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["all"]
all = [
    "button",
    "card",
    "input",
    "checkbox",
    "badge",
    "navbar",
    "modal",
    "alert",
    "theme",
    "icon",
    "typography",
    "notification",
    "tabs",
    "switch",
    "tooltip",
    "drawer",
    "dropdown",
    "animation",
    "serde",
]
serde = ["dep:serde"]
button = []
card = []
input = []
checkbox = []
badge = []
navbar = []
modal = []
alert = []
theme = []
icon = []
typography = []
notification = []
tabs = []
switch = []
tooltip = []
drawer = []
dropdown = []
animation = []
