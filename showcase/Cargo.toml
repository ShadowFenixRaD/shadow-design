[package]
name = "showcase"
version = "0.1.0"
authors = ["ShadowfenixRaD", "Christian Torbidone <killerbossoriginal@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { workspace = true, features = ["router"] }
shadow-design = { path = "../crate", features = ["all"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
