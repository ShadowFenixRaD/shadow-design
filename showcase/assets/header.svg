<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Dark deep vivid purple gradients for Shadowfenix -->
    <linearGradient id="fenix-wing-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="fenix-wing-right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="fenix-core" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="40%" stop-color="#581c87" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <linearGradient id="fenix-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0533" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="fenix-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#581c87" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="60" cy="60" r="54" fill="url(#fenix-aura)" />

  <!-- Outer Wing Feathers - Left -->
  <path d="M60 76 C50 68, 22 55, 12 30 C18 42, 28 50, 42 56 C26 48, 20 38, 16 18 C26 32, 40 42, 54 48 C44 36, 40 24, 38 10 C50 24, 58 38, 60 50 Z" 
        fill="url(#fenix-wing-left)" filter="url(#shadow-glow)" opacity="0.95" />

  <!-- Outer Wing Feathers - Right -->
  <path d="M60 76 C70 68, 98 55, 108 30 C102 42, 92 50, 78 56 C94 48, 100 38, 104 18 C94 32, 80 42, 66 48 C76 36, 80 24, 82 10 C70 24, 62 38, 60 50 Z" 
        fill="url(#fenix-wing-right)" filter="url(#shadow-glow)" opacity="0.95" />

  <!-- Inner Wing Accent Blades - Left -->
  <path d="M60 68 C52 60, 36 50, 26 36 C34 44, 44 48, 56 52 Z" fill="#c084fc" opacity="0.8" />
  <!-- Inner Wing Accent Blades - Right -->
  <path d="M60 68 C68 60, 84 50, 94 36 C86 44, 76 48, 64 52 Z" fill="#c084fc" opacity="0.8" />

  <!-- Phoenix Body & Head -->
  <!-- Tail Plumes extending into shadow -->
  <path d="M60 75 L54 98 L60 114 L66 98 Z" fill="url(#fenix-wing-left)" opacity="0.9" />
  <path d="M60 78 L46 95 L52 104 L57 88 Z" fill="#581c87" opacity="0.75" />
  <path d="M60 78 L74 95 L68 104 L63 88 Z" fill="#581c87" opacity="0.75" />

  <!-- Main Torso / Crest -->
  <path d="M60 26 C57 32, 53 42, 54 58 C55 68, 58 75, 60 78 C62 75, 65 68, 66 58 C67 42, 63 32, 60 26 Z" 
        fill="url(#fenix-core)" />

  <!-- Head Crest Feather / Horn -->
  <path d="M60 16 L57 26 L60 24 L63 26 Z" fill="#e9d5ff" />
  <!-- Glowing Eye / Diamond Crown -->
  <polygon points="60,22 62,26 60,30 58,26" fill="#ffffff" />
  
  <!-- Shadow Overlay to create dark depth -->
  <path d="M60 58 L56 70 L60 75 L64 70 Z" fill="#18042b" opacity="0.6" />
</svg>