<!DOCTYPE html>
<html lang="it">
  <head>
    <title>{app_title}</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <!-- Boot CSS: paints the void before the WASM bundle loads (no white flash).
         Tokens are not available yet, so these two values mirror --sd-void and --sd-text. -->
    <style>
      html, body { background-color: #030305; color: #f4f4f5; color-scheme: dark; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
